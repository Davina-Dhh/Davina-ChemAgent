<!DOCTYPE html>
<html><head><meta charset="utf-8" /></head><body>
<script>
(function () {
  const doc = window.parent.document;
  const VER = "__VER__";
  const ROOT_ID = "chem-ops-manual-root";
  const STYLE_ID = "chem-ops-manual-style";
  const BODY_HTML = __BODY__;

  const old = doc.getElementById(ROOT_ID);
  if (old && old.getAttribute("data-ver") === VER) {
    return;
  }
  if (old) old.remove();
  const oldStyle = doc.getElementById(STYLE_ID);
  if (oldStyle) oldStyle.remove();

  const css = [
    "#chem-ops-manual-root { all: initial; font-family: 'Space Grotesk', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }",
    "#chem-ops-manual-root * { box-sizing: border-box; }",
    "#chem-ops-manual-root .com-fab { position: fixed; right: 18px; bottom: 22px; z-index: 2147483000; width: 56px; height: 56px; border: none; border-radius: 50%; cursor: pointer; color: #fff; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; background: linear-gradient(145deg, #39C6FF, #1E8AD8 55%, #0B4F8A); box-shadow: 0 10px 28px rgba(30,138,216,0.45), 0 0 0 3px rgba(255,255,255,0.85); transition: transform 0.18s ease, box-shadow 0.18s ease; }",
    "#chem-ops-manual-root .com-fab:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 14px 32px rgba(30,138,216,0.55), 0 0 18px rgba(57,198,255,0.35); }",
    "#chem-ops-manual-root .com-panel { position: fixed; top: 72px; right: 24px; width: min(420px, calc(100vw - 24px)); max-height: min(78vh, 720px); z-index: 2147483001; display: none; flex-direction: column; background: linear-gradient(165deg, rgba(255,255,255,0.97), rgba(232,245,255,0.96)); border: 1px solid rgba(30,138,216,0.35); border-radius: 16px; box-shadow: 0 22px 50px rgba(14,79,138,0.22); overflow: hidden; backdrop-filter: blur(10px); }",
    "#chem-ops-manual-root .com-panel.com-open { display: flex; }",
    "#chem-ops-manual-root .com-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 0.85rem; cursor: move; user-select: none; background: linear-gradient(120deg, #0B4F8A, #1E8AD8 60%, #39C6FF); color: #fff; }",
    "#chem-ops-manual-root .com-head h3 { margin: 0; flex: 1; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.04em; }",
    "#chem-ops-manual-root .com-head .com-sub { display: block; font-size: 0.68rem; opacity: 0.88; font-weight: 500; margin-top: 0.15rem; }",
    "#chem-ops-manual-root .com-head button { border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.14); color: #fff; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; line-height: 1; }",
    "#chem-ops-manual-root .com-head button:hover { background: rgba(255,255,255,0.28); }",
    "#chem-ops-manual-root .com-body { padding: 0.85rem 1rem 1.1rem; overflow: auto; color: #0E2438; font-size: 0.86rem; line-height: 1.55; }",
    "#chem-ops-manual-root .com-sec { margin: 0 0 0.95rem; padding-bottom: 0.85rem; border-bottom: 1px solid rgba(30,138,216,0.14); }",
    "#chem-ops-manual-root .com-sec-last { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }",
    "#chem-ops-manual-root .com-sec h4 { margin: 0 0 0.45rem; font-size: 0.92rem; color: #0B4F8A; }",
    "#chem-ops-manual-root .com-sec p { margin: 0.35rem 0; }",
    "#chem-ops-manual-root .com-sec ul, #chem-ops-manual-root .com-sec ol { margin: 0.35rem 0 0.2rem 1.15rem; padding: 0; }",
    "#chem-ops-manual-root .com-sec li { margin: 0.22rem 0; }",
    "#chem-ops-manual-root .com-tip { margin-top: 0.45rem !important; padding: 0.45rem 0.6rem; border-radius: 8px; background: rgba(57,198,255,0.12); border: 1px solid rgba(30,138,216,0.22); color: #0B4F8A; font-size: 0.8rem; }",
    "#chem-ops-manual-root .com-flow { padding: 0.55rem 0.65rem; border-radius: 10px; background: linear-gradient(120deg, rgba(14,79,138,0.08), rgba(57,198,255,0.12)); border: 1px solid rgba(30,138,216,0.25); font-weight: 600; color: #0A3D6E; font-size: 0.82rem; }",
    "#chem-ops-manual-root code { font-family: ui-monospace, Consolas, monospace; font-size: 0.8em; background: rgba(14,79,138,0.08); padding: 0.05em 0.35em; border-radius: 4px; }",
    "@media (max-width: 640px) { #chem-ops-manual-root .com-panel { width: calc(100vw - 16px); right: 8px; top: 56px; max-height: 75vh; } #chem-ops-manual-root .com-fab { right: 12px; bottom: 14px; width: 50px; height: 50px; font-size: 12px; } }"
  ].join("\n");

  const style = doc.createElement("style");
  style.id = STYLE_ID;
  style.textContent = css;
  doc.head.appendChild(style);

  const root = doc.createElement("div");
  root.id = ROOT_ID;
  root.setAttribute("data-ver", VER);

  const fab = doc.createElement("button");
  fab.type = "button";
  fab.className = "com-fab";
  fab.title = "打开/关闭操作手册";
  fab.setAttribute("aria-label", "操作手册");
  fab.textContent = "手册";

  const panel = doc.createElement("div");
  panel.className = "com-panel";
  panel.setAttribute("role", "dialog");
  panel.setAttribute("aria-label", "操作手册");

  const head = doc.createElement("div");
  head.className = "com-head";
  const headText = doc.createElement("div");
  headText.style.cssText = "flex:1;min-width:0;";
  headText.innerHTML = "<h3>操作手册</h3><span class=\"com-sub\">ChemAgent · 可拖动 · 盖住全站</span>";
  const closeBtn = doc.createElement("button");
  closeBtn.type = "button";
  closeBtn.className = "com-close";
  closeBtn.title = "关闭";
  closeBtn.textContent = "×";
  head.appendChild(headText);
  head.appendChild(closeBtn);

  const body = doc.createElement("div");
  body.className = "com-body";
  body.innerHTML = BODY_HTML;

  panel.appendChild(head);
  panel.appendChild(body);
  root.appendChild(fab);
  root.appendChild(panel);
  doc.body.appendChild(root);

  const KEY = "chemagent_ops_manual";
  function loadState() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function saveState(patch) {
    const cur = loadState();
    localStorage.setItem(KEY, JSON.stringify(Object.assign(cur, patch)));
  }

  const st0 = loadState();
  if (typeof st0.x === "number" && typeof st0.y === "number") {
    panel.style.left = st0.x + "px";
    panel.style.top = st0.y + "px";
    panel.style.right = "auto";
  }
  if (st0.open) panel.classList.add("com-open");

  function toggle(force) {
    const open = typeof force === "boolean" ? force : !panel.classList.contains("com-open");
    panel.classList.toggle("com-open", open);
    saveState({ open: open });
  }
  fab.addEventListener("click", function (e) {
    e.stopPropagation();
    toggle();
  });
  closeBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    toggle(false);
  });

  let drag = null;
  head.addEventListener("pointerdown", function (e) {
    if (e.target.closest("button")) return;
    const rect = panel.getBoundingClientRect();
    drag = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
    head.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  head.addEventListener("pointermove", function (e) {
    if (!drag) return;
    const x = Math.max(8, Math.min(window.parent.innerWidth - 80, e.clientX - drag.dx));
    const y = Math.max(8, Math.min(window.parent.innerHeight - 80, e.clientY - drag.dy));
    panel.style.left = x + "px";
    panel.style.top = y + "px";
    panel.style.right = "auto";
  });
  function endDrag() {
    if (!drag) return;
    drag = null;
    const rect = panel.getBoundingClientRect();
    saveState({ x: rect.left, y: rect.top });
  }
  head.addEventListener("pointerup", endDrag);
  head.addEventListener("pointercancel", endDrag);
})();
</script>
</body></html>
